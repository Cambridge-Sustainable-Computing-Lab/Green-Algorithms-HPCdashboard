# Cluster info file example
#
# ~~~ TO BE EDITED AND TAILORED TO THE CLUSTER ~~~
# Fill in the values for your cluster: all the variables in <> need to be changed
## Updated: 04/03/2025

## ----- ABOUT THE CLUSTER -----

institution: "University of ..."
cluster_name: "OurCluster"
workload_manager: "SLURM"

granularity_memory_request: 6 # in GB

## ----- HARDWARE INFO. -----

hardware_profiles:
  XeonGold6142:
    type: "CPU" # CPU or GPU
    model: "Xeon Gold 6142"
    TDP: 9.4 # in W, per core
  XeonPlatinum8276:
    type: "CPU"
    model: "Xeon Platinum 8276"
    TDP: 5.9 # from https://ark.intel.com/content/www/us/en/ark/products/192470/intel-xeon-platinum-8276-processor-38-5m-cache-2-20-ghz.html
  XeonPlatinum8368Q:
    type: "CPU"
    model: "Xeon Platinum 8368Q"
    TDP: 7.1 # from https://www.intel.com/content/www/us/en/products/sku/212289/intel-xeon-platinum-8368q-processor-57m-cache-2-60-ghz/specifications.html
  NVIDIAA100-SXM-80GBGPUs_AMDEPYC7763:
    type: "GPU"
    model: "NVIDIA A100-SXM-80GB GPUs"
    TDP: 300 # from https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/PB-10577-001_v02.pdf
    model_CPU: "AMD EPYC 7763"
    TDP_CPU: 4.4 # from https://www.amd.com/fr/products/cpu/amd-epyc-7763
  XeonE5-2660v3:
    type: "CPU"
    model: "Xeon E5-2660 v3"
    TDP: 10.5 # from https://ark.intel.com/content/www/us/en/ark/products/81706/intel-xeon-processor-e52660-v3-25m-cache-2-60-ghz.html
  TeslaP100PCIe_XeonE5-2650v4:
    type: "GPU"
    model: "Tesla P100 PCIe"
    TDP: 250 # from https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/tesla-p100/pdf/nvidia-tesla-p100-PCIe-datasheet.pdf
    model_CPU: "Xeon E5-2650 v4"
    TDP_CPU: 8.8 # from https://ark.intel.com/content/www/us/en/ark/products/91767/intel-xeon-processor-e52650-v4-30m-cache-2-20-ghz.html


## ----- PARTITIONS -----

partitions:
  yew:
    homogenous: True
    hardware_profile: "XeonGold6142"
  yew-himem:
    homogenous: True
    hardware_profile: "XeonGold6142"
  beech:
    homogenous: True
    hardware_profile: "XeonPlatinum8276"
  beech-himem:
    homogenous: True
    hardware_profile: "XeonPlatinum8276"
  ash:
    homogenous: True
    hardware_profile: "XeonPlatinum8368Q"
  ash-himem:
    homogenous: True
    hardware_profile: "XeonPlatinum8368Q"
  oak:
    homogenous: True
    hardware_profile: "NVIDIAA100-SXM-80GBGPUs_AMDEPYC7763"
  birch:
    homogenous: True
    hardware_profile: "XeonE5-2660v3"
  pine:
    homogenous: True
    hardware_profile: "TeslaP100PCIe_XeonE5-2650v4"
  het:
    homogenous: False
    node_list:
      - range: "cpu-p-[90, 100]"
        hardware_profile: "XeonPlatinum8368Q"
      - range: "cpu-p-[120, 130]"
        hardware_profile: "XeonGold6142"


## ----- FACILITY AND SITE PARAMETERS -----

PUE: 1.15 # > 1
CI: 231.12 # carbon intensity, in gCO2e/kWh

# postcode below has to be compatible with the Carbon Intensity API used. 
# If data centre is based outside of UK, leave postcode empty (CI key above will be used instead).
postcode: "CB1" 

energy_cost:
  cost: 0.34 # in currency/kWh
  currency: "£"

granularity_memory_request: 6 # in GB

#
# Below are optional parameters to accommodate some clusters. Do not remove but can be ignored.
#
default_unit_RSS: 'K'