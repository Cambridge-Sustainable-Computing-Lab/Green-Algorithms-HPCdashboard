# Cluster info file template
#
# ~~~ TO BE EDITED TO BE TAILORED TO THE CLUSTER ~~~
# Fill in the values for your cluster: all the variables in <> need to be changed

## ----- ABOUT THE CLUSTER -----

institution: "<My institution>" # [str]
cluster_name: "<My cluster name>" # [str]
workload_manager: "<Workload manager used by my cluster>" # [str]


## ----- HARDWARE PROFILES -----

hardware_profiles:
  <hardware profile name_1>: # name of the hardware profile
    type: <CPU> # [CPU or GPU]
    model: "<Intel XXX>" # [str] the model of the processing core on this hardware profile. Not actually used by the code but useful for reference for others.
    TDP: <10> # [number] TDP of the processor, in W, per core
  <hardware profile name_2>: # name of the hardware profile
    type: <GPU> # [CPU or GPU]
    model: "<NVIDIA XXX>" # [str] the model of the processing core on this hardware profile. Not actually used by the code but useful for reference for others.
    TDP: <250> # [number] For GPUs, the TDP is for the entire GPU
    # For GPU hardware profiles, we also need info about the CPUs available for support.
    model_CPU: "<Intel XXX>" # [str] Not actually used by the code but useful for reference for others.
    TDP_CPU: <10> # [number] TDP of the processor, in W, per core
  # You can keep adding hardware profiles to this


## ----- PARTITIONS -----

partitions: # a list of the different partitions on the cluster
  # Homogenous partition: all nodes have the same hardware profile
  <partition name_1>: # name of the partition
    homogenous: True
    hardware_profile: <hardware profile name_1> # name of the hardware profile
  # Heterogeneous partition: nodes have different hardware profiles
  <partition name_2>: # name of the partition
    homogenous: False
    nodes_list:
      - range: "<node range>" # node-list-prefix[int, int] range of nodes within this parition with the same hardware profile
        hardware_profile: <hardware profile name_1> # name of the hardware profile for this range of nodes
      - range: "<node range>" # node-list-prefix[int, int] range of nodes within this parition with the same hardware profile
        hardware_profile: <hardware profile name_2> # name of the hardware profile for this range of nodes
  # You can keep adding partitions to this


## ----- FACILITY AND SITE PARAMETERS -----

PUE: <1.67> # [number > 1] Power Usage Effectiveness of the facility
CI: <467> # [number] average carbon intensity of the geographic location, in gCO2e/kWh

# postcode below has to be compatible with the Carbon Intensity API used. 
# If data centre is based outside of UK, leave postcode empty (CI key above will be used instead).
postcode: <Postcode> # [str] First 3 letters of the postcode of the data centre

energy_cost:
  cost: <0.34> # [number] in currency/kWh
  currency: "<£>" # [str]

granularity_memory_request: <6> # [number] in GB representing the smallest memory unit users can reserve

#
# Below are optional parameters to accommodate some clusters. Do not remove but can be ignored.
#
default_unit_RSS: 'K'
