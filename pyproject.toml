[project]
name = "ga-dashboard"
version = "0.1.0"
description = "Package to extract HPC usage data and display it in an interactive dashboard."
authors = [
    {name = "Green Algorithms",email = "green.algorithms@gmail.com"}
]
license = {text = "CC-BY-4.0"}
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "grafana-client (==5.0.1)",
    "pandas (==2.3.2)",
    "psycopg (==3.2.10)",
    "pyyaml (==6.0.2)",
    "random-password-generator (==2.2.0)",
    "maskpass (==0.3.7)",
    "poetry (==2.1.4)",
    "poetry-core (==2.1.3)",
    "psycopg-binary (==3.2.10)",
    "pytest (==8.4.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
